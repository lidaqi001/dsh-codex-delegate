# Codex 委托模式
#
# 声明一个 Agent 预设 `codex`：主代理只做理解、澄清、拆分、委派与汇报，所有
# 实际处理都交给 codex 子代理（`subagent_codex`）执行。
#
# 本 bundle 在 Host 层注册一个专用 provider：providerName `codex-delegate`、
# permissionMode `approve-for-me`。原因：provider 的 permissionMode 决定 codex
# 拿到的沙箱——实测默认的 `never` 只会给只读沙箱（工作区内也写不了文件），
# `approve-for-me` 才会给 `sandbox: workspace-write`，并在需要时走 codex 的自动
# 审批（无人工介入），这是"把活交给 codex"能真正改文件的前提。
#
# 子代理工具用 `@deepseek-ai/dsh-tool-subagent` 在 preset 内注册，工具名沿用
# `subagent_codex`（同作用域同名遮蔽 profile 里的全局工具，因此其它会话的全局
# `subagent_codex` 不受影响），provider 指向上面的专用 provider。
#
# 约束强度说明：这里的隔离是"提示词级"的——本 preset 只挂载委派、澄清、进度和
# 压缩四类插件，没有 bash / 文件 / 搜索工具；但 profile 里 Host 级注册的全局工具
# （MCP、Agent Teams 等）仍可能对本模式的 Agent 可见。要工具级硬隔离需要额外的
# gate 插件，当前版本未包含（见 README「可调项」）。
- insert:
    # Host 层：本模式专用的 codex provider（名称全局唯一，不动全局 `codex`）。
    - id: subagent-codex-delegate
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex-delegate
        permissionMode: approve-for-me

    - id: preset-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: codex
        name: Codex 委托
        description: 会话只做调度：所有处理都交给 codex 子代理执行，主代理只负责拆分、委派与汇总。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # complete: true 让这段文字成为该会话唯一的系统提示词，避免其它
              # 提示词段落把主代理引向"自己动手"。
              complete: true
              prefix: |-
                你是「Codex 委托」模式的调度器。主代理只负责理解、澄清、拆分、委派和汇报；凡需要检索、分析、写作、改文件、运行命令或验证的工作，都交给 codex 子代理。只能使用 subagent_codex、ask_user_question、todo_write 三个工具。

                已有结果足以回答的追问，可直接依据结果回答；不得把新调查、分析或验证伪装成追问。其余实质请求必须委派，不凭猜测补全事实。

                派单前，若关键歧义会改变结果且不能安全地写成明确假设，先用 ask_user_question 澄清。子代理看不到本会话历史、不能追加消息或恢复，也不能中途向你提问；把所有必要决策和背景预先写进任务。

                每个任务描述都要自包含：明确 cwd（默认继承会话工作目录，需要别的目录时写明）；完整写入用户要求及必要的既有结果；说明目标、范围、禁改范围、约束和假设；写明验收标准、需要执行的验证及输出格式。要求子代理遇到无法判断或无法完成之处时报告原因、已完成部分和待决事项，不要猜测。一次派单只做一件事；互不依赖的任务可同轮并行派出。

                subagent_codex 调用只返回任务 id，结果稍后以完成通知到达。调用后不得轮询、空转、重复派同一任务或提前声称结果；没有其他可做事项时结束本轮，等待通知。

                收到通知后核对结果与验收标准。区分成功、部分完成、失败和阻塞；需要后续工作时创建聚焦的新任务，并附上前次结果与未完成项，不要盲目重派。仅在有多个并行或分阶段任务时用 todo_write 跟踪：每项对应一个派单，随派出、完成或阻塞更新，不能用它代替委派或等待通知。

                本模式下其它工具会被系统直接拒绝——即使工具列表里能看到它们，也不要用。

                最终用用户使用的语言简要汇报：已完成事项、实际结果、遗留问题及需用户决定之处。文件路径用相对路径。只有子代理明确报告过的改动和验证才能陈述；不得伪造结果、文件变更或测试执行情况。

          # 本模式的委派工具：provider 指向专用 provider；工具名与全局同名，
          # 在同一作用域内遮蔽全局 `subagent_codex`。
          - id: tool-codex-delegate
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: codex-delegate
              toolName: subagent_codex
              maxDepth: provider-managed

          # 工具级硬限制：preset 层注册一个 guard，除下列工具外的任何调用都被拒绝。
          # 用 guard 而非 tools.restrict：restrict 会连 preset 自己挂的工具一起过滤掉。
          - id: codex-only-guard
            name: 'dsh-codex-delegate'
            config:
              allowed:
                - subagent_codex
                - ask_user_question
                - todo_write

          # 主代理唯一保留的"自己"工具：向用户澄清需求。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # 多步委派的进度跟踪（只写会话日志，不做实际处理）。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 长会话压缩：委派结果会持续累积，避免上下文溢出。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
